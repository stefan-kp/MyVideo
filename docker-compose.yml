services:
  myvideo:
    build: .
    image: ghcr.io/stefan-kp/myvideo:latest
    env_file: .env
    # Host networking is required for RTSP/SAT>IP to work without packet loss.
    # The Docker bridge namespace causes ~thousands of dropped RTP packets even
    # with raised host sysctls (net.core.rmem_max). Bridge-mode packet loss was
    # field-confirmed: docker-host probe shows ✓ OK with ~5 decode errors,
    # while bridge-mode in the same container shows ~2900 missed RTP packets.
    #
    # Because host networking ignores `ports:`, the server listens directly on
    # PORT (set in .env) on the host. The Cloudflare Tunnel must point at that
    # same host port. Pick a PORT that doesn't collide with other containers
    # on the same Pi (defaults to 3000 - change to 3377 or similar if needed).
    network_mode: host
    volumes:
      - logos:/app/public/logos
      - data:/app/data
      - ./stream:/app/stream
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get(`http://localhost:${process.env.PORT||3000}/health`, r => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  logos:
  data:
